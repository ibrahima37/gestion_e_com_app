services:
  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    restart: always

  config-service:
    build: ./config-service
    ports:
      - "8888:8888"
    restart: always

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
    restart: always

  boutique-service:
    build: ./boutique-service
    ports:
      - "8081:8081"
    depends_on:
      - discovery-service
    restart: always

  commande-service:
    build: ./commande-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-service
    restart: always

  utilisateur-service:
    build: ./utilisateur-service
    ports:
      - "8084:8084"
    depends_on:
      - discovery-service
    restart: always

  paiement-service:
    build: ./paiement-service
    ports:
      - "8083:8083"
    depends_on:
      - discovery-service
    restart: always

networks:
  default:
    name: ecommerce-net
